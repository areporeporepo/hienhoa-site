name: Audit live site

# Runs on GitHub's machines, so it keeps working when the laptop is asleep.
# Twice a day plus on every push, and manually when needed.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1,13 * * *'      # 08:00 and 20:00 Vietnam time
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium

      - name: Wait for Pages to publish this commit
        if: github.event_name == 'push'
        run: sleep 90

      - name: Audit
        run: node audit.mjs

      # Keep the screenshot either way: on a pass it is a visual record, on a
      # failure it is the fastest way to see what broke.
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: audit-full.png
          retention-days: 30
